name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
            build: cargo

          - os: ubuntu-latest
            arch: aarch64-unknown-linux-gnu
            artifact: linux-aarch64
            build: zigbuild

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}

      - name: Install zig
        if: matrix.build == 'zigbuild'
        uses: goto-bus-stop/setup-zig@v2

      - name: Install cargo-zigbuild
        if: matrix.build == 'zigbuild'
        run: cargo install cargo-zigbuild --locked

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev

      - name: Install ARM64 GTK/GLib dependencies
        if: matrix.arch == 'aarch64-unknown-linux-gnu'
        run: |
          set -euo pipefail

          sudo dpkg --add-architecture arm64
          sudo apt-get update

          sudo apt-get install -y \
            libgtk-4-dev:arm64 \
            libadwaita-1-dev:arm64 \
            libglib2.0-dev:arm64 \
            libgdk-pixbuf-2.0-dev:arm64 \
            libcairo2-dev:arm64 \
            libpango1.0-dev:arm64 \
            libgraphene-1.0-dev:arm64

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary (cargo)
        if: matrix.build == 'cargo'
        run: cargo build --release --target ${{ matrix.arch }}

      - name: Build release binary (zigbuild)
        if: matrix.build == 'zigbuild'
        run: cargo zigbuild --release --target ${{ matrix.arch }}
        env:
          PKG_CONFIG_ALLOW_CROSS: '1'
          PKG_CONFIG_LIBDIR: /usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          PKG_CONFIG_SYSROOT_DIR: /

      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          src="target/${{ matrix.arch }}/release/runbox"
          cp "$src" dist/runbox

          tar -czf "runbox-${{ matrix.artifact }}.tar.gz" -C dist runbox

          ls -lh "runbox-${{ matrix.artifact }}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: runbox-${{ matrix.artifact }}
          path: runbox-${{ matrix.artifact }}.tar.gz


  deb:
    name: Build Debian package
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            debhelper-compat \
            dpkg-dev \
            pkg-config \
            libgtk-4-dev \
            libglib2.0-dev \
            libgdk-pixbuf-2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libgraphene-1.0-dev \
            libadwaita-1-dev

      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Build Debian package
        run: |
          set -euo pipefail
          dpkg-buildpackage -us -uc

      - name: Collect Debian package
        run: |
          set -euo pipefail

          mkdir -p dist
          cp ../runbox_*.deb dist/

          ls -lh dist/

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: runbox-deb
          path: dist/*.deb


  release:
    name: Create draft release
    needs:
      - build
      - deb

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download x86_64 binary
        uses: actions/download-artifact@v4
        with:
          name: runbox-linux-x86_64
          path: dist

      - name: Download aarch64 binary
        uses: actions/download-artifact@v4
        with:
          name: runbox-linux-aarch64
          path: dist

      - name: Download Debian package
        uses: actions/download-artifact@v4
        with:
          name: runbox-deb
          path: dist

      - name: Show release files
        run: |
          find dist -maxdepth 2 -type f -print -exec ls -lh {} \;

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/runbox-linux-x86_64.tar.gz
            dist/runbox-linux-aarch64.tar.gz
            dist/runbox_*.deb