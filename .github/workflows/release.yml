name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.artifact }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64
          - os: ubuntu-24.04
            arch: x86_64-unknown-linux-gnu
            artifact: linux-x86_64

          # ARM64
          - os: ubuntu-24.04-arm
            arch: aarch64-unknown-linux-gnu
            artifact: linux-aarch64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-4-dev \
            libadwaita-1-dev

      - name: Verify build environment
        run: |
          uname -m
          rustc --version
          cargo --version
          pkg-config --version
          pkg-config --modversion gtk4
          pkg-config --modversion libadwaita-1

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: |
          cargo build \
            --release \
            --target "${{ matrix.arch }}"

      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          src="target/${{ matrix.arch }}/release/runbox"

          test -f "$src"

          cp "$src" dist/runbox

          tar -czf \
            "runbox-${{ matrix.artifact }}.tar.gz" \
            -C dist \
            runbox

          ls -lh \
            "runbox-${{ matrix.artifact }}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: runbox-${{ matrix.artifact }}
          path: runbox-${{ matrix.artifact }}.tar.gz


  deb:
    name: Build Debian package

    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            debhelper-compat \
            dpkg-dev \
            cargo \
            pkg-config \
            libgtk-4-dev \
            libglib2.0-dev \
            libgdk-pixbuf-2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libgraphene-1.0-dev \
            libadwaita-1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Rust toolchain
        run: |
          echo "PATH=$PATH"
          echo "cargo=$(command -v cargo)"
          echo "rustc=$(command -v rustc)"

          cargo --version
          rustc --version

      - name: Check Debian build dependencies
        run: |
          dpkg-checkbuilddeps

      - name: Build Debian package
        run: |
          set -euo pipefail

          dpkg-buildpackage -us -uc

      - name: Collect Debian package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          cp ../runbox_*.deb dist/

          ls -lh dist/

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: runbox-deb
          path: dist/*.deb


  release:
    name: Create draft release

    needs:
      - build
      - deb

    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Download x86_64 binary
        uses: actions/download-artifact@v4
        with:
          name: runbox-linux-x86_64
          path: dist

      - name: Download ARM64 binary
        uses: actions/download-artifact@v4
        with:
          name: runbox-linux-aarch64
          path: dist

      - name: Download Debian package
        uses: actions/download-artifact@v4
        with:
          name: runbox-deb
          path: dist

      - name: Show release files
        run: |
          find dist \
            -maxdepth 2 \
            -type f \
            -print \
            -exec ls -lh {} \;

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/runbox-linux-x86_64.tar.gz
            dist/runbox-linux-aarch64.tar.gz
            dist/runbox_*.deb